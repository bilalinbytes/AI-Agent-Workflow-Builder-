              source: nhost/emails
              target: /app/email-templates
              read_only: false
    configserver:
        image: nhost/cli:1.50.1
        command:
            - configserver
            - --enable-playground
            - --debug
        environment:
            DOCKER_COMPOSE_PROJECT: vocallab
            DOCKER_HOST: unix:///var/run/docker.sock
            NHOST_APP_ID: f4d04c11-0457-4813-9153-5e6c907406ee
        extra_hosts: []
        labels:
            traefik.enable: "true"
            traefik.http.routers.configserver.entrypoints: web
            traefik.http.routers.configserver.rule: (HostRegexp(`^.+\.dashboard\.local\.nhost\.run$`) || Host(`local.dashboard.nhost.run`))&& PathPrefix(`/v1/configserver`)
            traefik.http.routers.configserver.service: configserver
            traefik.http.routers.configserver.tls: "true"
            traefik.http.routers.logs.entrypoints: web
            traefik.http.routers.logs.rule: (HostRegexp(`^.+\.dashboard\.local\.nhost\.run$`) || Host(`local.dashboard.nhost.run`))&& PathPrefix(`/v1/logs`)
            traefik.http.routers.logs.service: logs
            traefik.http.routers.logs.tls: "true"
            traefik.http.services.configserver.loadbalancer.server.port: "8088"
            traefik.http.services.logs.loadbalancer.server.port: "8088"
        restart: always
        volumes:
            - type: bind
              source: nhost
              target: /tmp/root/nhost
              read_only: false
            - type: bind
              source: .
              target: /tmp/root
              read_only: false
            - type: bind
              source: /var/run/docker.sock
              target: /var/run/docker.sock
              read_only: true
              bind:
                selinux: z
