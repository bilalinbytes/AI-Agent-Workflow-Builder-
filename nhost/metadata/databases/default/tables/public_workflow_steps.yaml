table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns: "*"
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: "*"
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
insert_permissions:
  - role: owner
    permission:
      check:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _eq: owner
      columns:
        - workflow_id
        - type
        - step_order
        - config
  - role: editor
    permission:
      check:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _in:
                  - owner
                  - editor
      columns:
        - workflow_id
        - type
        - step_order
        - config
update_permissions:
  - role: owner
    permission:
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _eq: owner
      columns:
        - type
        - step_order
        - config
  - role: editor
    permission:
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _in:
                  - owner
                  - editor
      columns:
        - type
        - step_order
        - config
delete_permissions:
  - role: owner
    permission:
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _eq: owner
  - role: editor
    permission:
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _in:
                  - owner
                  - editor
