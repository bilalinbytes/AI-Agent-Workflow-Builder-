table:
  name: organizations
  schema: public
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: organization_id
        table:
          name: org_members
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: organization_id
        table:
          name: workflows
          schema: public
  - name: org_usage_stats
    using:
      manual_configuration:
        column_mapping:
          id: organization_id
        remote_table:
          name: org_usage_stats
          schema: public
select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
          role:
            _eq: owner
  - role: editor
    permission:
      columns: "*"
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
          role:
            _in:
              - owner
              - editor
  - role: viewer
    permission:
      columns: "*"
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
