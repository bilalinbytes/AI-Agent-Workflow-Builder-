table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns: "*"
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: "*"
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
insert_permissions:
  - role: owner
    permission:
      check:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
      columns:
        - workflow_id
        - status
  - role: editor
    permission:
      check:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
      columns:
        - workflow_id
        - status
