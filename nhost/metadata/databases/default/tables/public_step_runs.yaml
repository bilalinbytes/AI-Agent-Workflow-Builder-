table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: step
    using:
      foreign_key_constraint_on: workflow_step_id
select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns: "*"
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: "*"
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
update_permissions:
  - role: owner
    permission:
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      columns:
        - status
        - approved_by
        - approved_at
        - output
  - role: editor
    permission:
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      columns:
        - status
        - approved_by
        - approved_at
        - output
event_triggers:
  - name: step_run_notify
    definition:
      enable_manual: false
      insert:
        columns: "*"
      update:
        columns:
          - status
    retry_conf:
      num_retries: 0
      interval_sec: 10
      timeout_sec: 60
    webhook: "{{NHOST_FUNCTIONS_URL}}/notifyEventTrigger"
